services:
  postgres:
    image: postgres:16-alpine
    container_name: workfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-workfolio_db}
    # Security & Port Mapping:
    # - Local: 127.0.0.1:5432 exposes DB exclusively to host machine (DBeaver/DataGrip), blocked from external LAN.
    # - Production: Remove 'ports' completely. The database must live exclusively inside 'backend-network'
    #   or be hosted on a managed cloud service (e.g. Neon.tech) with encrypted TLS connections.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d workfolio_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  telemetry-ms:
    build:
      context: .
      dockerfile: docker/telemetry-ms.Dockerfile
    container_name: workfolio-telemetry-ms
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TELEMETRY_MS_HOST: 0.0.0.0
      TELEMETRY_MS_PORT: 4001
    # Fully isolated microservice: internal TCP port, no host port exposure needed
    networks:
      - backend-network

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: workfolio-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      telemetry-ms:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/workfolio_db?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/workfolio_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-workfolio-super-secret-jwt-key-2026}
      ADMIN_SECRET_PASSCODE: ${ADMIN_SECRET_PASSCODE:-workfolio-admin-2026}
      TELEMETRY_MS_HOST: telemetry-ms
      TELEMETRY_MS_PORT: 4001
      WEB_ORIGIN: http://localhost:3000
    # Production Note: In a production VPS setup behind Nginx/Caddy or Cloud Ingress (e.g. AWS ALB),
    # ports: - "127.0.0.1:4000:4000" only serves reverse proxy traffic. On PaaS (Render/Fly.io) this is automatic.
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend-network
      - frontend-network

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: workfolio-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://api:4000
      ENABLE_REDACT: ${ENABLE_REDACT:-false}
    ports:
      - "3000:3000"
    networks:
      - frontend-network

networks:
  # Isolated private network for database and microservices (zero external access)
  backend-network:
    driver: bridge
  # Demilitarized zone network connecting frontend to API gateway
  frontend-network:
    driver: bridge

volumes:
  postgres_data:
