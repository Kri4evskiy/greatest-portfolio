name: "🐛 Bug Report"
description: "Report a reproducible problem or defect in the monorepo"
title: "fix: [Short summary of the bug]"
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide sufficient detail to reproduce the bug.
  - type: dropdown
    id: workspace
    attributes:
      label: "Affected Workspace"
      description: "Which part of the monorepo is affected?"
      multiple: true
      options:
        - "apps/web (Next.js 16)"
        - "apps/api (NestJS 12)"
        - "apps/telemetry-ms (TCP Microservice)"
        - "packages/shared-schemas (Zod v4)"
        - "packages/ui (Design System)"
        - "Root / CI/CD / Docker"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Describe the Bug"
      description: "A clear and concise description of what happened and what you expected instead."
      placeholder: "When opening the Knowledge Base article without a token..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Minimal steps to reproduce the issue."
      placeholder: |
        1. Run `pnpm run dev`
        2. Navigate to `http://localhost:3000/en/knowledge-base`
        3. See error...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Environment Info"
      description: "Node version, pnpm version, OS, browser (e.g. Node 22.18, pnpm 12.18, Windows 11, Chrome 130)."
      placeholder: "Node 22.18.0, pnpm 12.18.0, Windows 11"
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: "Pre-submission Checks"
      options:
        - label: "I verified that this bug is not already reported in existing issues."
          required: true
        - label: "I have tested with the latest code from `main`."
          required: false
