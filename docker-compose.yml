services:
  postgres:
    image: postgres:16-alpine
    container_name: workfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-workfolio_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workfolio_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  telemetry-ms:
    build:
      context: .
      dockerfile: docker/telemetry-ms.Dockerfile
    container_name: workfolio-telemetry-ms
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TELEMETRY_MS_HOST: 0.0.0.0
      TELEMETRY_MS_PORT: 4001
    ports:
      - "4001:4001"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: workfolio-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      telemetry-ms:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/workfolio_db?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/workfolio_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-workfolio-super-secret-jwt-key-2026}
      ADMIN_SECRET_PASSCODE: ${ADMIN_SECRET_PASSCODE:-workfolio-admin-2026}
      TELEMETRY_MS_HOST: telemetry-ms
      TELEMETRY_MS_PORT: 4001
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: workfolio-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://api:4000
      ENABLE_REDACT: ${ENABLE_REDACT:-false}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
