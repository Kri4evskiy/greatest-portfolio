services:
  postgres:
    image: postgres:16-alpine
    container_name: greatest-portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio_secret_password
      POSTGRES_DB: greatest_portfolio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d greatest_portfolio"]
      interval: 5s
      timeout: 5s
      retries: 5

  telemetry-ms:
    build:
      context: .
      dockerfile: docker/telemetry-ms.Dockerfile
    container_name: greatest-portfolio-telemetry-ms
    restart: unless-stopped
    environment:
      TELEMETRY_MS_HOST: 0.0.0.0
      TELEMETRY_MS_PORT: 4001
    ports:
      - "4001:4001"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: greatest-portfolio-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      telemetry-ms:
        condition: service_started
    environment:
      API_PORT: 4000
      DATABASE_URL: postgresql://portfolio:portfolio_secret_password@postgres:5432/greatest_portfolio?schema=public
      JWT_SECRET: production-super-secret-jwt-key-2026
      ADMIN_SECRET_PASSCODE: workfolio-admin-2026
      TELEMETRY_MS_HOST: telemetry-ms
      TELEMETRY_MS_PORT: 4001
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: greatest-portfolio-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_ORIGIN: http://api:4000
      ENABLE_REDACT: "false"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
