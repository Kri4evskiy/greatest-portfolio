name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  LEFTHOOK: 0
  DO_NOT_TRACK: 1
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  lint:
    name: Lint & Format (Biome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (shallow)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup monorepo workspace
        uses: ./.github/actions/setup-workspace

      - name: Run Biome check
        run: pnpm run lint

      - name: Lint GitHub Actions workflows (actionlint)
        run: |
          ACTIONLINT_VERSION="1.7.12"
          BASE_URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          CHECKSUMS="actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          curl -fsSL -o "/tmp/${ARCHIVE}" "${BASE_URL}/${ARCHIVE}"
          curl -fsSL -o "/tmp/${CHECKSUMS}" "${BASE_URL}/${CHECKSUMS}"
          (cd /tmp && sha256sum --ignore-missing --check "${CHECKSUMS}" && tar -xzf "${ARCHIVE}" actionlint)
          /tmp/actionlint -color

  security:
    name: Security & Infra Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (shallow)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  typecheck:
    name: Typecheck (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      - name: Setup monorepo workspace & codegen
        uses: ./.github/actions/setup-workspace
        with:
          prepare-codegen: "true"

      - name: Run Turborepo typecheck
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TURBO_SCM_BASE="${{ github.event.pull_request.base.sha }}" pnpm exec turbo run typecheck --affected
          else
            pnpm run typecheck
          fi

  unit-tests:
    name: Unit & Integration Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      - name: Setup monorepo workspace & codegen
        uses: ./.github/actions/setup-workspace
        with:
          prepare-codegen: "true"

      - name: Run Turborepo Vitest unit & integration suites
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TURBO_SCM_BASE="${{ github.event.pull_request.base.sha }}" pnpm exec turbo run test --affected
          else
            pnpm run test
          fi

      - name: Run NestJS Backend HTTP E2E (Supertest)
        run: pnpm --filter @repo/api test:e2e

  build:
    name: Production Build (Turborepo)
    needs: [ lint, typecheck ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      - name: Setup monorepo workspace
        uses: ./.github/actions/setup-workspace

      - name: Restore Turborepo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Run Turborepo build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TURBO_SCM_BASE="${{ github.event.pull_request.base.sha }}" pnpm exec turbo run build --affected
          else
            pnpm run build
          fi

  storybook:
    name: Storybook Build (@repo/ui)
    needs: [ lint, typecheck ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      - name: Setup monorepo workspace
        uses: ./.github/actions/setup-workspace

      - name: Build @repo/ui Storybook
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TURBO_SCM_BASE="${{ github.event.pull_request.base.sha }}" pnpm exec turbo run build-storybook --affected
          else
            pnpm exec turbo run build-storybook
          fi

  e2e:
    name: Full-Stack E2E (Playwright)
    needs: [ lint, typecheck, build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (shallow)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup monorepo workspace
        uses: ./.github/actions/setup-workspace

      - name: Restore Turborepo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-

      - name: Read @playwright/test version
        id: playwright-version
        run: |
          VERSION=$(node -e "const pkg = require('./apps/web/node_modules/@playwright/test/package.json'); console.log(pkg.version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium binaries
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium & system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @repo/web exec playwright install-deps chromium

      - name: Ensure production builds for @repo/api and @repo/web
        run: pnpm exec turbo run build --filter=@repo/api... --filter=@repo/web...

      - name: Run Playwright E2E suite
        run: pnpm --filter @repo/web test:e2e

      - name: Upload Playwright report & failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
